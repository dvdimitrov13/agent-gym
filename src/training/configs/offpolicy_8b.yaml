# Off-policy TI/TO GRPO — test config for Qwen3-8B on 2x RTX 3090
model_name: "Qwen/Qwen3-8B"
dataset: "data/train_trl_v2_curriculum.jsonl"

per_device_train_batch_size: 2
gradient_accumulation_steps: 1
num_generations: 4
max_completion_length: 384
max_tool_calling_iterations: 4

# DAPO (OLMo-3 style)
loss_type: "dapo"
beta: 0.0
temperature: 1.0
learning_rate: 1e-5

num_train_epochs: 1
max_steps: 50
logging_steps: 1
save_steps: 25

# LoRA
use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: "all-linear"

bf16: true
gradient_checkpointing: true

# V2 env
use_v2_env: true
use_v2_rewards: true
disable_thinking: true

# Server
server_port: 8000

# Output
output_dir: "checkpoints/offpolicy-0.6b-test"

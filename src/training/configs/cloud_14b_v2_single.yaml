# V2 single-GPU config — Blackwell 98GB
# Pre-built curriculum: 2 sorted epochs + 2 shuffled epochs in one dataset
model_name: "Qwen/Qwen3-14B"
dataset: "data/train_trl_v2_curriculum.jsonl"

per_device_train_batch_size: 2
gradient_accumulation_steps: 2
num_generations: 4
max_completion_length: 1024
max_tool_calling_iterations: 8

# GRPO (length-biased, SID-1 style)
loss_type: "grpo"
beta: 0.0
temperature: 0.7
learning_rate: 1e-5

# 1000 total steps (600 done + 400 more = ~2 extra epochs)
num_train_epochs: 1
max_steps: 1300
logging_steps: 1
save_steps: 50

# LoRA
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: "all-linear"

bf16: true
gradient_checkpointing: true
mask_truncated_completions: false

# V2
use_v2_env: true
use_v2_rewards: true
use_tito: true

# No curriculum — already past all transitions, use final values
# max_completion_length: 1024, max_tool_calling_iterations: 10
# Thinking: soft nudge at 256, no hard cap (reward annealing handles it)

# Resume from checkpoint-600
resume_from_checkpoint: "checkpoints/qwen3-14b-grpo-v2/checkpoint-1100"

# Output
output_dir: "checkpoints/qwen3-14b-grpo-v2"
